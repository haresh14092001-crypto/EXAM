<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgadhamVet OS - Board Exam Prep Compendium</title>
    
    <!-- CDNs and Styling Dependencies -->
    <!-- Vercel Geist Sans via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/font/sans.css">
    
    <!-- Tailwind CSS (via Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Geist Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Marked.js (Markdown parser) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- FormKit AutoAnimate CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@formkit/auto-animate@1.0.0-beta.6/index.min.js"></script>
    
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    
    <!-- Alpine.js Persist Plugin (LOAD BEFORE ALPINE CORE) -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
    <!-- Alpine.js Core -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Custom styling to align with shadcn/ui minimal monochrome look -->
    <style>
        body {
            font-family: 'Geist Sans', sans-serif;
            background-color: #ffffff;
            color: #09090b; /* zinc-950 */
        }
        /* Custom scrollbar matching minimal aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e4e4e7; /* zinc-200 */
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4d4d8; /* zinc-300 */
        }
        /* Focus state outline override */
        input:focus {
            outline: none;
            box-shadow: none;
        }
        /* Scrollbar hiding utilities for mobile filter view */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen antialiased bg-white text-zinc-950 flex flex-col" x-data="examApp">

    <!-- TOP GLUED 2PX PROGRESS BAR -->
    <div class="fixed top-0 left-0 right-0 h-[2px] bg-zinc-100 z-50 overflow-hidden">
        <div 
            class="h-full bg-zinc-900 transition-all duration-300 ease-out"
            :style="`width: ${progressPercentage}%`"
        ></div>
    </div>

    <!-- STICKY TOP HEADER -->
    <header class="sticky top-0 z-40 border-b border-zinc-200 bg-white/95 backdrop-blur-md">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
            <!-- App Branding -->
            <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-tight text-zinc-900">AgadhamVet OS Prep</h1>
                <p class="text-[9px] font-bold text-zinc-400 uppercase tracking-widest mt-0.5">100% Enriched Compendium</p>
            </div>
            
            <!-- Controls & Study Mode -->
            <div class="flex items-center gap-2">
                <!-- Active Recall / Study Mode Toggle -->
                <button 
                    @click="studyMode = !studyMode" 
                    :class="studyMode ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white text-zinc-600 border-zinc-200 hover:bg-zinc-50'"
                    class="flex items-center gap-1.5 px-3 rounded-lg text-xs font-semibold border transition-all duration-100 select-none min-h-[44px] active:scale-95"
                >
                    <!-- BookOpen Icon SVG -->
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    <span class="hidden xs:inline" x-text="studyMode ? 'Study Mode: ON' : 'Study Mode: OFF'"></span>
                    <span class="xs:hidden" x-text="studyMode ? 'Study' : 'Review'"></span>
                </button>

                <!-- Cmd+K Spotlight Search Button (Desktop) -->
                <button 
                    @click="openPalette = true" 
                    class="hidden sm:flex items-center justify-between gap-6 bg-zinc-50 border border-zinc-200 rounded-lg py-1.5 px-3 text-xs text-zinc-400 focus:outline-none hover:bg-zinc-100/50 hover:border-zinc-300 transition-all duration-100 select-none min-h-[44px] active:scale-95"
                >
                    <div class="flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <span>Search compendium...</span>
                    </div>
                    <kbd class="px-1.5 py-0.5 text-[9px] font-bold text-zinc-400 bg-white border border-zinc-200 rounded">⌘K</kbd>
                </button>

                <!-- Spotlight Search Button (Mobile Fallback) -->
                <button 
                    @click="openPalette = true" 
                    class="sm:hidden flex items-center justify-center bg-zinc-50 border border-zinc-200 rounded-lg p-2 text-zinc-600 hover:bg-zinc-100 transition-all duration-100 select-none min-h-[44px] w-[44px] active:scale-95"
                    title="Search Compendium"
                >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </button>
            </div>
        </div>

        <!-- Sleek Filters & Stats Bar -->
        <div class="max-w-3xl mx-auto px-4 sm:px-6 pb-4 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <!-- Filter Pills (Scrollable on Mobile) -->
            <div class="flex flex-nowrap overflow-x-auto hide-scrollbar gap-2 w-full pb-1 sm:pb-0 flex-1">
                <button 
                    @click="selectedSubject = 'All'; limit = 50" 
                    :class="selectedSubject === 'All' ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white text-zinc-600 border-zinc-200 hover:bg-zinc-50'"
                    class="px-4.5 py-2 rounded-full text-xs font-bold border transition-all duration-100 min-h-[44px] flex items-center justify-center select-none whitespace-nowrap active:scale-95"
                >
                    All
                </button>
                <button 
                    @click="selectedSubject = 'Medicine'; limit = 50" 
                    :class="selectedSubject === 'Medicine' ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white text-zinc-600 border-zinc-200 hover:bg-zinc-50'"
                    class="px-4.5 py-2 rounded-full text-xs font-bold border transition-all duration-100 min-h-[44px] flex items-center justify-center select-none whitespace-nowrap active:scale-95"
                >
                    Medicine (VMD)
                </button>
                <button 
                    @click="selectedSubject = 'Surgery'; limit = 50" 
                    :class="selectedSubject === 'Surgery' ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white text-zinc-600 border-zinc-200 hover:bg-zinc-50'"
                    class="px-4.5 py-2 rounded-full text-xs font-bold border transition-all duration-100 min-h-[44px] flex items-center justify-center select-none whitespace-nowrap active:scale-95"
                >
                    Surgery (VSR)
                </button>
                <button 
                    @click="selectedSubject = 'Theriogenology'; limit = 50" 
                    :class="selectedSubject === 'Theriogenology' ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white text-zinc-600 border-zinc-200 hover:bg-zinc-50'"
                    class="px-4.5 py-2 rounded-full text-xs font-bold border transition-all duration-100 min-h-[44px] flex items-center justify-center select-none whitespace-nowrap active:scale-95"
                >
                    Theriogenology (VGO)
                </button>
            </div>

            <!-- HY & Bookmark Toggles -->
            <div class="flex items-center gap-4 flex-wrap sm:flex-nowrap">
                <label class="flex items-center gap-2 cursor-pointer select-none text-xs font-semibold text-zinc-600 hover:text-zinc-900 min-h-[44px] active:scale-[0.98] transition-transform duration-100">
                    <input 
                        type="checkbox" 
                        x-model="showOnlyHighYield" 
                        @change="limit = 50"
                        class="w-4 h-4 rounded border-zinc-300 text-zinc-900 focus:ring-zinc-900 cursor-pointer"
                    >
                    <span>⭐ High-Yield</span>
                </label>

                <div class="h-3 w-px bg-zinc-200 hidden sm:block"></div>

                <label class="flex items-center gap-2 cursor-pointer select-none text-xs font-semibold text-zinc-600 hover:text-zinc-900 min-h-[44px] active:scale-[0.98] transition-transform duration-100">
                    <input 
                        type="checkbox" 
                        x-model="showOnlyMastered" 
                        @change="limit = 50"
                        class="w-4 h-4 rounded border-zinc-300 text-zinc-900 focus:ring-zinc-900 cursor-pointer"
                    >
                    <span>🔖 Bookmarked</span>
                </label>
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTENT -->
    <main class="max-w-3xl mx-auto w-full px-4 sm:px-6 py-8 flex-1">
        
        <!-- Live Status Stats -->
        <div class="mb-6 flex justify-between items-center text-xs font-semibold text-zinc-400 uppercase tracking-wider">
            <div>
                Showing <span x-text="paginatedQuestions.length" class="text-zinc-900"></span> of 
                <span x-text="filteredQuestions.length" class="text-zinc-900"></span> questions
            </div>
            <div>
                Mastered: <span x-text="masteredIds.length" class="text-zinc-900"></span> / 
                <span x-text="questions.length" class="text-zinc-900"></span> (<span x-text="progressPercentage"></span>%)
            </div>
        </div>

        <!-- Question List Accordion Container -->
        <div class="space-y-3" x-init="autoAnimate($el)">
            <template x-for="item in paginatedQuestions" :key="item.id">
                <div 
                    class="border border-zinc-200 rounded-xl overflow-hidden hover:border-zinc-300 transition-all bg-white"
                    x-init="autoAnimate($el)" 
                    :id="'q-' + item.id"
                >
                    <!-- Card Header -->
                    <div 
                        @click="toggleAccordion(item.id)" 
                        class="cursor-pointer py-3.5 px-4 sm:p-5 flex items-start justify-between gap-4 select-none hover:bg-zinc-50/50 transition-all duration-100 min-h-[44px] active:scale-[0.99]"
                    >
                        <div class="space-y-2 flex-1">
                            <div class="flex flex-wrap gap-1.5 items-center">
                                <span class="px-2 py-0.5 rounded bg-zinc-100 text-zinc-800 text-[9px] font-bold border border-zinc-200" x-text="item.subject"></span>
                                <span class="text-[9px] font-bold text-zinc-400" x-text="'ID: #' + item.id"></span>
                                <template x-if="item.is_high_yield">
                                    <span class="px-2 py-0.5 rounded bg-zinc-900 text-white text-[9px] font-bold tracking-wide">⭐ High Yield</span>
                                </template>
                            </div>
                            
                            <h3 class="text-sm sm:text-base font-semibold tracking-tight text-zinc-900 leading-snug" x-text="item.question_text"></h3>
                        </div>
                        
                        <!-- Mastery Bookmark & Open Arrow -->
                        <div class="flex items-center gap-2" @click.stop>
                            <!-- Bookmark button -->
                            <button 
                                @click="toggleMastery(item.id, $event)" 
                                class="rounded-lg border border-zinc-200 hover:bg-zinc-50 text-zinc-400 hover:text-zinc-900 transition-all duration-100 min-h-[44px] min-w-[44px] flex items-center justify-center p-2.5 active:scale-95"
                                :title="isMastered(item.id) ? 'Remove Mastery' : 'Mark as Mastered'"
                            >
                                <svg 
                                    class="w-4 h-4" 
                                    :fill="isMastered(item.id) ? 'currentColor' : 'none'" 
                                    :class="isMastered(item.id) ? 'text-zinc-900' : 'text-zinc-400'"
                                    stroke="currentColor" 
                                    viewBox="0 0 24 24"
                                >
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                                </svg>
                            </button>
                            
                            <!-- Expand arrow -->
                            <button 
                                @click="toggleAccordion(item.id)"
                                class="rounded-lg border border-zinc-200 text-zinc-400 hover:text-zinc-900 transition-all duration-100 min-h-[44px] min-w-[44px] flex items-center justify-center p-2.5 active:scale-95"
                                :class="activeId === item.id ? 'rotate-180 text-zinc-900' : ''"
                            >
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Accordion Body -->
                    <div 
                        x-show="activeId === item.id" 
                        class="border-t border-zinc-100 bg-zinc-50 p-5 sm:p-6"
                        x-init="autoAnimate($el)"
                    >
                        <!-- STUDY MODE (ACTIVE RECALL) OVERLAY -->
                        <template x-if="studyMode && !isRevealed(item.id)">
                            <div class="py-10 text-center space-y-4">
                                <p class="text-xs font-semibold text-zinc-400 uppercase tracking-widest">Active Recall Active</p>
                                <button 
                                    @click="revealAnswer(item.id)" 
                                    class="px-6 py-2.5 bg-zinc-900 text-white rounded-lg text-xs font-bold hover:bg-zinc-800 transition-all duration-100 shadow-sm min-h-[44px] inline-flex items-center justify-center active:scale-95"
                                >
                                    Reveal Answer
                                </button>
                            </div>
                        </template>

                        <!-- CLINICAL DETAILS / CONTENT LAYER -->
                        <template x-if="!studyMode || isRevealed(item.id)">
                            <div class="space-y-6">
                                <!-- Empty State Check -->
                                <template x-if="!item.Core_Anatomy && !item.Pathogenesis_Immediate && !item.Pathogenesis_Deep && !item.Why_Not && !item.Wow_Approach">
                                    <div class="text-center py-8 text-zinc-400 text-sm font-medium italic">
                                        Detailed breakdown pending. Focus on High-Yield topics first.
                                    </div>
                                </template>

                                <!-- 5-Part Framework / 1-Mark content Renders -->
                                <template x-if="item.Core_Anatomy || item.Pathogenesis_Immediate || item.Pathogenesis_Deep || item.Why_Not || item.Wow_Approach">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <!-- Core Anatomy Locus -->
                                        <div class="space-y-1.5" x-show="item.Core_Anatomy">
                                            <h4 class="font-bold uppercase tracking-wider text-[10px] text-zinc-400 border-b border-zinc-100 pb-1">Core Anatomy Locus</h4>
                                            <div class="prose prose-zinc max-w-none text-xs sm:text-sm text-zinc-800 leading-relaxed font-medium" x-html="renderMarkdown(item.Core_Anatomy)"></div>
                                        </div>

                                        <!-- Immediate Pathogenesis -->
                                        <div class="space-y-1.5" x-show="item.Pathogenesis_Immediate">
                                            <h4 class="font-bold uppercase tracking-wider text-[10px] text-zinc-400 border-b border-zinc-100 pb-1">Immediate Pathogenesis</h4>
                                            <div class="prose prose-zinc max-w-none text-xs sm:text-sm text-zinc-800 leading-relaxed" x-html="renderMarkdown(item.Pathogenesis_Immediate)"></div>
                                        </div>

                                        <!-- Deep Cellular Pathway -->
                                        <div class="space-y-2 md:col-span-2 bg-white p-4 rounded-xl border border-zinc-200/80 shadow-sm" x-show="item.Pathogenesis_Deep">
                                            <h4 class="font-bold uppercase tracking-wider text-[10px] text-zinc-400 border-b border-zinc-100 pb-1">Deep Cellular & Biochemical Pathway</h4>
                                            <div class="prose prose-zinc max-w-none text-xs sm:text-sm text-zinc-800 leading-relaxed" x-html="renderMarkdown(item.Pathogenesis_Deep)"></div>
                                        </div>

                                        <!-- Why Not Distractors -->
                                        <div class="space-y-1.5" x-show="item.Why_Not">
                                            <h4 class="font-bold uppercase tracking-wider text-[10px] text-zinc-400 border-b border-zinc-100 pb-1">Why Not (Differential Mechanics)</h4>
                                            <div class="prose prose-zinc max-w-none text-xs sm:text-sm text-zinc-800 leading-relaxed" x-html="renderMarkdown(item.Why_Not)"></div>
                                        </div>

                                        <!-- Wow Approach Logic -->
                                        <div class="space-y-1.5" x-show="item.Wow_Approach">
                                            <h4 class="font-bold uppercase tracking-wider text-[10px] text-zinc-400 border-b border-zinc-100 pb-1">Wow Approach (Board Gold)</h4>
                                            <div class="prose prose-zinc max-w-none text-xs sm:text-sm text-zinc-800 leading-relaxed font-medium" x-html="renderMarkdown(item.Wow_Approach)"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- LOAD MORE BUTTON -->
        <div class="mt-8 text-center" x-show="hasMore()">
            <button 
                @click="loadMore()" 
                class="px-6 py-2.5 bg-white border border-zinc-200 hover:border-zinc-300 rounded-xl text-xs font-bold hover:bg-zinc-50 transition-all duration-100 text-zinc-800 select-none shadow-sm min-h-[44px] inline-flex items-center justify-center active:scale-95"
            >
                Load More Questions
            </button>
        </div>

        <!-- Empty state global message -->
        <div class="text-center py-16" x-show="filteredQuestions.length === 0" style="display: none;">
            <p class="text-sm font-semibold text-zinc-400 uppercase tracking-widest">No matching questions</p>
            <p class="text-xs text-zinc-400 mt-1">Adjust your subject filters, bookmark filter, or search input.</p>
        </div>
    </main>

    <!-- macOS SPOTLIGHT COMMAND PALETTE OVERLAY -->
    <div 
        x-show="openPalette" 
        class="fixed inset-0 z-50 overflow-y-auto"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        style="display: none;"
        @keydown.window.escape="openPalette = false"
    >
        <!-- Backdrop blur overlay -->
        <div class="fixed inset-0 bg-zinc-900/20 backdrop-blur-sm transition-opacity" @click="openPalette = false"></div>

        <!-- Palette centered panel -->
        <div class="flex min-h-full items-start justify-center p-4 sm:p-6 md:p-20">
            <div 
                class="relative w-full max-w-xl transform rounded-xl bg-white shadow-2xl border border-zinc-200 transition-all divide-y divide-zinc-100 overflow-hidden"
                @click.away="openPalette = false"
                x-transition:enter="transition ease-out duration-200"
                x-transition:enter-start="opacity-0 scale-95"
                x-transition:enter-end="opacity-100 scale-100"
                x-transition:leave="transition ease-in duration-150"
                x-transition:leave-start="opacity-100 scale-100"
                x-transition:leave-end="opacity-0 scale-95"
            >
                <!-- Search bar inside palette -->
                <div class="flex items-center px-4 py-4">
                    <svg class="w-5 h-5 text-zinc-400 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input 
                        type="text" 
                        x-model="searchQuery" 
                        placeholder="Type keywords (e.g. 'BVDV', 'fracture', 'retained')..." 
                        class="w-full text-base text-zinc-900 placeholder-zinc-400 bg-transparent border-0 focus:ring-0 focus:outline-none"
                        x-init="$watch('openPalette', val => { if(val) { $nextTick(() => $el.focus()) } })"
                    >
                    <button @click="openPalette = false" class="text-xs font-semibold text-zinc-400 hover:text-zinc-600 px-1.5 py-0.5 border border-zinc-200 rounded">ESC</button>
                </div>

                <!-- Palette Results -->
                <div class="max-h-80 overflow-y-auto py-2 text-sm text-zinc-800" x-show="searchQuery">
                    <div class="px-4 py-2 text-xs font-bold text-zinc-400 uppercase tracking-widest">Matching Prep Questions</div>
                    <template x-for="q in filteredQuestions.slice(0, 5)" :key="q.id">
                        <div 
                            @click="activeId = q.id; openPalette = false; limit = Math.max(limit, questions.indexOf(q) + 1); $nextTick(() => { document.getElementById('q-' + q.id)?.scrollIntoView({ behavior: 'smooth', block: 'center' }) })" 
                            class="flex items-center justify-between px-4 py-3 hover:bg-zinc-50 cursor-pointer transition-colors"
                        >
                            <div class="flex flex-col gap-0.5 pr-4">
                                <span class="font-semibold text-zinc-950 truncate max-w-xs sm:max-w-md" x-text="q.question_text"></span>
                                <span class="text-[9px] text-zinc-400 uppercase tracking-wider font-bold" x-text="q.subject + ' • ' + (q.topic || 'General')"></span>
                            </div>
                            <svg class="w-4 h-4 text-zinc-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </template>
                    <template x-if="filteredQuestions.length === 0">
                        <div class="px-4 py-6 text-center text-zinc-400">No matching questions found.</div>
                    </template>
                </div>

                <!-- Palette Footer Hints -->
                <div class="px-4 py-2.5 bg-zinc-50 text-[10px] text-zinc-400 flex items-center justify-between">
                    <span>Search results dynamically filter background workspace view.</span>
                    <span class="font-semibold uppercase tracking-wider text-[8px]">AgadhamVet OS</span>
                </div>
            </div>
        </div>
    </div>

    <!-- NATIVE DATA INGESTION -->
    <script src="database.js"></script>

    <!-- ALPINE ACTIVE REACTIVE CONTROLLER -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('examApp', () => ({
                // Master Compendium Data
                questions: (typeof examData !== 'undefined' ? examData : []) || window.examData || [],
                
                // Reactive & LocalStorage Persistent State
                masteredIds: Alpine.$persist([]).as('mastered_questions_key'),
                studyMode: Alpine.$persist(false).as('study_mode_key'),
                
                // In-memory UI states
                searchQuery: '',
                selectedSubject: 'All',
                showOnlyHighYield: false,
                showOnlyMastered: false,
                limit: 50,
                activeId: null,
                openPalette: false,
                revealedIds: [], // Keeps track of active recall revealed questions in study mode

                init() {
                    // Keyboard Shortcut listener for macOS/Windows Spotlight style Command Palette (⌘K or Ctrl+K)
                    window.addEventListener('keydown', (e) => {
                        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                            e.preventDefault();
                            this.openPalette = !this.openPalette;
                        }
                    });
                },

                // Mastery / Bookmark Toggle
                toggleMastery(id, e) {
                    if (this.masteredIds.includes(id)) {
                        this.masteredIds = this.masteredIds.filter(x => x !== id);
                    } else {
                        this.masteredIds.push(id);
                        
                        // Micro-interaction confetti burst from exact click coordinates
                        if (window.confetti && e) {
                            confetti({
                                particleCount: 35,
                                spread: 45,
                                origin: {
                                    x: e.clientX / window.innerWidth,
                                    y: e.clientY / window.innerHeight
                                },
                                colors: ['#09090b', '#27272a', '#52525b', '#71717a', '#a1a1aa', '#ffffff'] // Monochrome slate
                            });
                        }
                    }
                },

                isMastered(id) {
                    return this.masteredIds.includes(id);
                },

                // Active Recall handlers
                revealAnswer(id) {
                    if (!this.revealedIds.includes(id)) {
                        this.revealedIds.push(id);
                    }
                },

                isRevealed(id) {
                    return this.revealedIds.includes(id);
                },

                // Calculated Progress Percentage
                get progressPercentage() {
                    if (this.questions.length === 0) return 0;
                    return Math.round((this.masteredIds.length / this.questions.length) * 100);
                },

                // Live Search & Filtering engine
                get filteredQuestions() {
                    return this.questions.filter(q => {
                        // Subject filtering
                        if (this.selectedSubject !== 'All') {
                            if (q.subject !== this.selectedSubject) return false;
                        }
                        // High yield filter
                        if (this.showOnlyHighYield && !q.is_high_yield) return false;
                        // Bookmarked/Mastered filter
                        if (this.showOnlyMastered && !this.isMastered(q.id)) return false;
                        // Search text/topic matching
                        if (this.searchQuery) {
                            const query = this.searchQuery.toLowerCase();
                            const txt = (q.question_text || '').toLowerCase();
                            const top = (q.topic || '').toLowerCase();
                            const deep = (q.Pathogenesis_Deep || '').toLowerCase();
                            if (!txt.includes(query) && !top.includes(query) && !deep.includes(query)) {
                                return false;
                            }
                        }
                        return true;
                    });
                },

                get paginatedQuestions() {
                    return this.filteredQuestions.slice(0, this.limit);
                },

                loadMore() {
                    this.limit += 50;
                },

                hasMore() {
                    return this.limit < this.filteredQuestions.length;
                },

                toggleAccordion(id) {
                    this.activeId = this.activeId === id ? null : id;
                    // Reset revealed status for active recall when toggled closed
                    if (this.activeId !== id) {
                        this.revealedIds = this.revealedIds.filter(x => x !== id);
                    }
                },

                renderMarkdown(text) {
                    if (!text) return '';
                    return marked.parse(text);
                }
            }));
        });
    </script>
</body>
</html>
